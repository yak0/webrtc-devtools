<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebRTC DevTools Playground</title>
    <style>
      body { margin: 0; font: 12px system-ui, sans-serif; }
      .pg { display: flex; flex-direction: column; height: 100vh; }
      .demo { flex: none; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 8px; border-bottom: 1px solid #8884; }
      .demo video { width: 120px; height: 68px; background: #000; border-radius: 3px; }
      .demo button { font: inherit; padding: 4px 8px; cursor: pointer; }
      .panel { flex: 1; min-height: 0; }
      @media (prefers-color-scheme: dark) { body { background: #1e1e1e; color: #ddd; } }
    </style>
  </head>
  <body>
    <div class="pg">
      <div class="demo">
        <strong>Demo app</strong>
        <button id="call">Start loopback call</button>
        <button id="badturn">Call with broken TURN</button>
        <button id="restart">Restart ICE</button>
        <button id="renegotiate">Add second video</button>
        <button id="badsdp">Bad remote SDP</button>
        <button id="leak">Leak a PC</button>
        <button id="gum">getUserMedia</button>
        <button id="livekit">LiveKit-like PC</button>
        <button id="hangup">Hang up</button>
        <video id="local" autoplay muted playsinline></video>
        <video id="remote" autoplay muted playsinline></video>
      </div>
      <div class="panel" id="panel"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
