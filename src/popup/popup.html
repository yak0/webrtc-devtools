<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WebRTC DevTools</title>
    <style>
      :root {
        color-scheme: light dark;
        --muted: #6b6b6b;
        --border: rgba(128, 128, 128, 0.25);
        --kbd: rgba(128, 128, 128, 0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --muted: #9a9a9a;
        }
        body {
          background: #1e1e1e;
          color: #ddd;
        }
      }
      body {
        margin: 0;
        width: 300px;
        font: 13px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        font-weight: 600;
      }
      header img {
        width: 18px;
        height: 18px;
      }
      section {
        padding: 10px 14px;
      }
      section + section {
        border-top: 1px solid var(--border);
      }
      .summary {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .muted {
        color: var(--muted);
      }
      ul.pcs {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 150px;
        overflow: auto;
      }
      ul.pcs li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 0;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
        background: #888;
      }
      .dot.success {
        background: #18a058;
      }
      .dot.warning {
        background: #f0a020;
      }
      .dot.error {
        background: #d03050;
      }
      .dot.info {
        background: #2080f0;
      }
      .health {
        margin-top: 8px;
        padding: 6px 8px;
        border-radius: 4px;
        font-weight: 500;
      }
      .health.error {
        background: rgba(208, 48, 80, 0.15);
        color: #d03050;
      }
      .health.warning {
        background: rgba(240, 160, 32, 0.15);
        color: #c07800;
      }
      ol {
        margin: 4px 0 0;
        padding-left: 18px;
      }
      ol li {
        margin: 4px 0;
      }
      kbd {
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        background: var(--kbd);
        border: 1px solid var(--border);
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 0 4px;
      }
      .tab {
        font-weight: 600;
      }
      .links {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
      }
      .links a {
        color: inherit;
        text-decoration: none;
        padding: 5px 8px;
        border: 1px solid var(--border);
        border-radius: 5px;
      }
      .links a:hover {
        background: rgba(32, 128, 240, 0.12);
        border-color: rgba(32, 128, 240, 0.5);
      }
    </style>
  </head>
  <body>
    <header><img src="../icons/32.png" alt="" /> WebRTC DevTools</header>
    <section id="status"><span class="muted">Checking this page…</span></section>
    <section>
      <div style="font-weight: 600">See the details</div>
      <ol id="steps"></ol>
      <div class="muted" style="margin-top: 6px" id="tip"></div>
    </section>
    <section>
      <div style="font-weight: 600; margin-bottom: 6px">Test your setup</div>
      <div class="links">
        <a href="#" data-tool="camera">Camera</a>
        <a href="#" data-tool="microphone">Microphone</a>
        <a href="#" data-tool="speakers">Speakers</a>
        <a href="#" data-tool="loopback">Call quality</a>
        <a href="#" data-tool="turn">STUN / TURN</a>
        <a href="#" data-tool="devices">All devices</a>
      </div>
    </section>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
